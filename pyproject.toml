[project]
name = "iz"
version = "0.7.0"
description = "Bağımlılıksız iz kütüphanesi: adım günlüğü, karar defteri, köken kartı"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
iz = "iz.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/iz"]

[tool.hatch.build.targets.wheel.force-include]
"sema" = "iz/_veri/sema"
"testdata" = "iz/_veri/testdata"

[tool.hatch.build.targets.sdist]
include = ["python/iz", "sema", "testdata", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = ["pytest==9.1.1", "jsonschema==4.26.0", "pyright==1.1.414"]

[tool.pytest.ini_options]
pythonpath = ["python", "."]
testpaths = ["python/tests"]

[tool.pyright]
include = ["python/iz", "betikler"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
extraPaths = ["python"]
